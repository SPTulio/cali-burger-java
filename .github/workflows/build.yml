name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilação, testes e capturas de tela
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compila e roda os testes
        run: mvn -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Abre a interface e gera as capturas de tela
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a -s "-screen 0 1280x800x24" mvn -B -q exec:exec \
            -Dexec.executable=java \
            -Dexec.classpathScope=test \
            "-Dexec.args=-Dprism.order=sw -classpath %classpath com.caliburger.ui.GeradorCapturas target/capturas" \
            2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Resume os erros encontrados
        if: failure()
        run: |
          resumo=$(grep -E "\[ERROR\]|Exception|Caused by|FAIL" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Falha no build::${resumo}"

      - uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: target/capturas
