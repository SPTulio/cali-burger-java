name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilação, testes e capturas de tela
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compila e roda os testes
        run: mvn -B verify

      - name: Abre a interface e gera as capturas de tela
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a -s "-screen 0 1280x800x24" mvn -B -q exec:exec \
            -Dexec.executable=java \
            -Dexec.classpathScope=test \
            "-Dexec.args=-Dprism.order=sw -classpath %classpath com.caliburger.ui.GeradorCapturas target/capturas"

      - uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: target/capturas
